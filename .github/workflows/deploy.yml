name: Deploy Static Website to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Copy website files from the /website folder to Azure VM
      - name: Copy Website Files to Azure VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          source: "website/*"
          target: "/home/${{ secrets.AZURE_VM_USER }}/site_temp"

      # Step 3: Deploy the files and restart Nginx
      - name: Deploy and Restart Nginx
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            echo "Cleaning old website files..."
            sudo rm -rf /var/www/html/*

            echo "Moving new files from site_temp to Nginx folder..."
            sudo cp -r ~/site_temp/* /var/www/html/

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "✅ Deployment complete! Your website is live."
